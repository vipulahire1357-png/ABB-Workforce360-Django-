{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · ABB Workforce360</title><link rel="icon" href="{% static 'webapp/abb-logo.svg' %}" type="image/svg+xml"><link rel="stylesheet" href="{% static 'webapp/app.css' %}"></head>
<body class="login-wrap"><form class="login" id="login-form"><img src="{% static 'webapp/abb-logo.svg' %}" alt="ABB"><h1>ABB Workforce360</h1><p>Sign in with your authorized portal credentials.</p><input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}"><label>Username<input name="username" required autocomplete="username" maxlength="80"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><div id="login-error" class="error" role="alert"></div><button class="primary full" type="submit">Sign in</button><small>Access is restricted to provisioned ABB Workforce360 operators.</small></form><script src="{% static 'webapp/app.js' %}" defer></script></body></html>
